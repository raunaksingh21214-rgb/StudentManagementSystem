
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage your student records easily</p>
    </header>

    <main>
        <section>
            <h2>Add New Student</h2>

            <form id="studentForm">
                <label for="name">Student Name</label>
                <input type="text" id="name" placeholder="Enter student name" required>

                <label for="roll">Roll Number</label>
                <input type="text" id="roll" placeholder="Enter roll number" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email" required>

                <label for="course">Course</label>
                <input type="text" id="course" placeholder="Enter course" required>

                <button type="submit">Add Student</button>
            </form>
        </section>

        <section>
            <h2>Student Records</h2>

            <input
                type="text"
                id="search"
                placeholder="Search by name or roll number"
            >

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <!-- Student records will appear here -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
